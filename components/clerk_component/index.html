<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clerk Authentication Component</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: transparent;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px;
    }
    #auth-container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
    }
    .error-card {
      background: #450a0a;
      border: 1px solid #991b1b;
      border-radius: 12px;
      padding: 20px;
      color: #fca5a5;
      width: 100%;
      font-size: 14px;
      line-height: 1.5;
    }
    .error-title {
      font-weight: 600;
      color: #f87171;
      margin-bottom: 6px;
      font-size: 15px;
    }
    #clerk-signin-root {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    /* Ensure Clerk component fits nicely */
    .cl-rootBox {
      width: 100% !important;
    }
    .cl-card {
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4) !important;
      border: 1px solid #334155 !important;
    }
  </style>
</head>
<body>
  <div id="auth-container">
    <div id="loading-state" class="status-card">
      <div class="spinner"></div>
      <div class="loading-text">Initializing Clerk Authentication...</div>
    </div>

    <div id="error-state" class="error-card" style="display: none;">
      <div class="error-title" id="error-title">Initialization Error</div>
      <div id="error-body"></div>
    </div>

    <div id="clerk-signin-root"></div>
  </div>

  <script>
    // Streamlit Component Protocol messaging
    function sendMessage(type, payload) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: type,
        ...payload
      }, "*");
    }

    function setComponentValue(value) {
      sendMessage("streamlit:setComponentValue", { value: value });
    }

    function updateFrameHeight() {
      const container = document.getElementById("auth-container");
      const height = Math.max(container.scrollHeight + 30, document.body.scrollHeight + 30, 480);
      sendMessage("streamlit:setFrameHeight", { height: height });
    }

    // Tell Streamlit component is ready
    sendMessage("streamlit:componentReady", { apiVersion: 1 });

    let clerkInitialized = false;
    let clerkInstance = null;
    let lastReportedSessionId = null;

    function showError(title, message) {
      document.getElementById("loading-state").style.display = "none";
      const errState = document.getElementById("error-state");
      document.getElementById("error-title").textContent = title;
      document.getElementById("error-body").textContent = message;
      errState.style.display = "block";
      updateFrameHeight();
    }

    async function handleAuthState(clerk) {
      if (clerk.user && clerk.session) {
        try {
          const token = await clerk.session.getToken();
          const sessionId = clerk.session.id;
          const userId = clerk.user.id;

          if (lastReportedSessionId !== sessionId || !lastReportedSessionId) {
            lastReportedSessionId = sessionId;
            setComponentValue({
              status: "authenticated",
              session_id: sessionId,
              session_token: token,
              user_id: userId,
              user_name: clerk.user.fullName || (clerk.user.firstName ? clerk.user.firstName + " " + (clerk.user.lastName || "") : clerk.user.username),
              email: clerk.user.primaryEmailAddress ? clerk.user.primaryEmailAddress.emailAddress : "",
              image_url: clerk.user.imageUrl || "",
              timestamp: Date.now()
            });
          }
        } catch (e) {
          console.error("Failed to obtain Clerk session token:", e);
        }
      }
    }

    window.addEventListener("message", async (event) => {
      if (!event.data || event.data.type !== "streamlit:render") return;

      const args = event.data.args || {};
      const publishableKey = args.publishable_key;
      const action = args.action;

      // Handle sign-out request if sent from Streamlit
      if (action === "sign_out" && window.Clerk) {
        try {
          await window.Clerk.signOut();
          lastReportedSessionId = null;
          setComponentValue({ status: "signed_out", timestamp: Date.now() });
        } catch (err) {
          console.error("Sign-out error:", err);
        }
        return;
      }

      if (!publishableKey || publishableKey.trim() === "" || publishableKey.includes("your_publishable_key_here")) {
        showError(
          "Clerk Key Configuration Needed",
          "CLERK_PUBLISHABLE_KEY is not configured in .env. Please set your valid Clerk Publishable Key (starts with 'pk_test_' or 'pk_live_') to enable Clerk Sign-In."
        );
        return;
      }

      if (clerkInitialized) {
        updateFrameHeight();
        return;
      }
      clerkInitialized = true;

      try {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js";
        script.setAttribute("data-clerk-publishable-key", publishableKey.trim());
        script.crossOrigin = "anonymous";
        script.async = true;

        script.onload = async () => {
          try {
            clerkInstance = window.Clerk;
            await clerkInstance.load({
              appearance: {
                variables: {
                  colorPrimary: "#6366f1",
                  colorBackground: "#1e293b",
                  colorText: "#f8fafc",
                  colorInputBackground: "#0f172a",
                  colorInputText: "#f8fafc",
                  borderRadius: "0.5rem"
                },
                elements: {
                  card: {
                    backgroundColor: "#1e293b",
                    borderColor: "#334155"
                  }
                }
              }
            });

            document.getElementById("loading-state").style.display = "none";

            // If already signed in
            if (clerkInstance.user && clerkInstance.session) {
              await handleAuthState(clerkInstance);
              return;
            }

            // Mount Clerk Sign-In
            const mountTarget = document.getElementById("clerk-signin-root");
            clerkInstance.mountSignIn(mountTarget, {
              routing: "hash"
            });

            // Monitor size changes
            const observer = new ResizeObserver(() => {
              updateFrameHeight();
            });
            observer.observe(document.body);
            observer.observe(mountTarget);
            setTimeout(updateFrameHeight, 500);
            setTimeout(updateFrameHeight, 1500);

            // Listen to login/logout events
            clerkInstance.addListener(async () => {
              await handleAuthState(clerkInstance);
            });

          } catch (err) {
            console.error("Clerk mount exception:", err);
            showError("Clerk Initialization Failed", err.message || "Failed to load Clerk authentication UI. Check your publishable key.");
          }
        };

        script.onerror = () => {
          showError("CDN Network Error", "Could not load the ClerkJS library from CDN. Please check your internet connection.");
        };

        document.head.appendChild(script);

      } catch (e) {
        console.error("Unexpected script load exception:", e);
        showError("Unexpected Error", e.message || "An unexpected error occurred while loading Clerk.");
      }
    });

    // Fallback frame height update
    setTimeout(updateFrameHeight, 600);
  </script>
</body>
</html>
